<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TubeTalk // transcript console</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="console-shell">
    <header class="masthead">
      <div class="brand-mark" role="img" aria-label="YouTube play logo"></div>
      <div>
        <p class="kicker">RAG TERMINAL</p>
        <h1>TubeTalk</h1>
      </div>
      <div class="status-lamp"><span></span><span id="statusText">STANDBY</span></div>
    </header>

    <section class="loader-panel" aria-labelledby="loaderTitle">
      <div class="section-label"><span>01</span><h2 id="loaderTitle">Load a transmission</h2></div>
      <form id="loadForm" class="load-form">
        <label for="videoInput">YouTube URL or video ID</label>
        <div class="input-row">
          <input id="videoInput" name="video" autocomplete="off" placeholder="dQw4w9WgXcQ OR https://www.youtube.com/watch?v=pRwASRs6BJa" required>
          <button type="submit" id="loadButton">LOAD</button>
        </div>
      </form>
      <div id="videoMeta" class="video-meta" hidden></div>
    </section>

    <section class="chat-panel" aria-labelledby="chatTitle">
      <div class="section-label"><span>02</span><h2 id="chatTitle">Ask about the Video</h2></div>
      <div id="emptyState" class="empty-state">Load a video to initialize the transcript archive.</div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="chatForm" class="chat-form" hidden>
        <label for="questionInput">Query</label>
        <div class="input-row">
          <input id="questionInput" autocomplete="off" placeholder="What is this video about?" required>
          <button type="submit" id="sendButton" disabled>ASK</button>
        </div>
      </form>
      <button type="button" id="clearButton" class="clear-button" hidden>Clear log</button>
    </section>
    <footer>LOCAL INDEX // GEMINI CORE // <span id="clock"></span></footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
